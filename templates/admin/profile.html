{% extends "admin_base.html" %}
{% block title %}Admin Profile - UniCore{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5 fade-in">
    <div class="col-md-8 col-lg-6">
        <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
            <!-- Header Section -->
            <div class="bg-gradient-primary p-4 text-center text-white position-relative">
                <div class="mb-3">
                    <div class="d-inline-flex align-items-center justify-content-center bg-white text-primary rounded-circle shadow-sm" style="width: 100px; height: 100px; font-size: 3rem;">
                        <i class="bi bi-person-circle"></i>
                    </div>
                </div>
                <h3 class="fw-bold mb-1">{{ admin.name }}</h3>
                <p class="mb-0 text-white-50 fs-5"><i class="bi bi-shield-lock-fill me-1"></i>Administrator</p>
                
                <!-- Edit Button overlay -->
                <a href="{{ url_for('admin.update_profile') }}" class="btn btn-light btn-sm rounded-circle shadow-sm position-absolute" style="top: 15px; right: 15px; width: 35px; height: 35px; padding: 6px;" title="Edit Profile">
                    <i class="bi bi-pencil-fill text-primary"></i>
                </a>
            </div>

            <!-- Profile Details Section -->
            <div class="card-body p-4 bg-white">
                <h5 class="fw-bold text-dark mb-4 border-bottom pb-2">Profile Information</h5>
                
                <div class="row mb-3">
                    <div class="col-sm-4 text-muted fw-medium"><i class="bi bi-envelope me-2"></i>Email</div>
                    <div class="col-sm-8 text-dark">{{ admin.email }}</div>
                </div>
            </div>
            
            <div class="card-footer bg-light p-3 text-center border-0">
                <a href="{{ url_for('admin.update_profile') }}" class="btn btn-primary rounded-pill px-4 fw-bold shadow-sm">
                    <i class="bi bi-pencil-square me-1"></i> Update Profile
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
